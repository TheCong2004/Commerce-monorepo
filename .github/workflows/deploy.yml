name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_ACCOUNT_ID
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        run: |
          npm install -g pnpm
          pnpm config delete use-node-version
          pnpm config delete node-version

      - name: Check environment
        run: |
          echo "Node version: $(node -v)"
          echo "Pnpm version: $(pnpm -v)"
          echo "Node path: $(which node)"
          echo "Pnpm path: $(which pnpm)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Merchant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -v
          pnpm --filter merchant run deploy

      - name: Deploy Web (OpenNext Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter web run build
          pnpm --filter web run build:cf
          pnpm --filter web run deploy

      - name: Build Tu Vi So (OpenNext Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter xemboituvi run build:cf

      - name: Deploy Tu Vi So (OpenNext Cloudflare)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter xemboituvi run deploy

      - name: Deploy Telegram Mini App
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter telegram-miniapp run build:cf
          pnpm --filter telegram-miniapp run deploy

      - name: Deploy Durable Objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter chatroom-do run deploy:prod || true
          pnpm --filter ping-do run deploy:prod || true
